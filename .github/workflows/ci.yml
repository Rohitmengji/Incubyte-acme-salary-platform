name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for the default 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  # Exercises exactly what a reviewer runs (ADR-0005): clean install, embedded PostgreSQL,
  # migrations, 10k seed, integration tests and the production build - on all three OSes.
  reviewer-path:
    name: Reviewer path (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Fail fast instead of hanging for the default 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run test:integration
      - run: npm run build
      - name: Stop local PostgreSQL
        if: always()
        run: npm run db:stop

  # Browser journeys (login, search, create employee, salary change/correction, history, analytics,
  # CSV import/export), axe accessibility checks and a phone-sized run, on an isolated acme_e2e database.
  e2e:
    name: End-to-end (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for the default 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop local PostgreSQL
        if: always()
        run: npm run db:stop
